<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pre-Kinder 2 Christmas Party - Auto Save</title><style>body{font-family:Arial;margin:0;background:#fff8e8;color:#302a27}header{background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;text-align:center;padding:48px 18px;border-bottom:12px solid #fde047}h1{font-size:clamp(36px,7vw,68px);margin:8px 0}.yellow{color:#fde047}.wrap{max-width:1100px;margin:auto;padding:25px 15px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.search{max-width:420px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #eee;border-radius:18px;padding:16px;box-shadow:0 4px 13px #0001;cursor:pointer}.card:hover{border-color:#ef4444}.name{font-size:18px;font-weight:800}.tag{display:inline-block;background:#fee2e2;color:#b91c1c;padding:5px 9px;border-radius:14px;font-size:12px;font-weight:bold;margin:8px 0}.muted{color:#999}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;width:min(500px,100%);border-radius:22px;overflow:hidden}.boxhead{background:#dc2626;color:#fff;padding:20px}.boxbody{padding:20px}.boxbody label{display:block;font-weight:bold;margin:16px 0 7px}.buttons{display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}.save{background:#dc2626;color:white;flex:1}.cancel{background:#eee}footer{text-align:center;background:#991b1b;color:white;padding:25px;margin-top:30px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}header{padding:35px 14px}}</style></head><body><header><div>🎄 🐝 🎁 🍗 ⭐</div><h1>Pre-Kinder 2<br><span class="yellow">Christmas Party</span></h1><p>Tap your child's card to add or edit food and wishlist. Your entries auto-save on this device.</p></header><main class="wrap"><div class="tools"><input class="search" id="search" placeholder="Search your child's name..."></div><div class="grid" id="list"></div><p style="text-align:center;color:#777;font-size:13px">Updates are saved on the browser/device being used.</p></main><footer><b class="yellow">Merry Christmas, Pre-Kinder 2! 🎄</b></footer><div class="modal" id="modal"><div class="box"><div class="boxhead"><b id="title"></b><div id="comp" style="margin-top:5px"></div></div><div class="boxbody"><label>🍗 Food choice</label><input id="food" placeholder="Enter food choice"><label>🎁 Christmas wishlist</label><textarea id="wish" rows="3" placeholder="Enter wishlist"></textarea><div class="buttons"><button class="btn cancel" onclick="closeModal()">Cancel</button><button class="btn save" onclick="save()">Done</button></div></div></div></div><script>
const base=[['Chase','2 adults','',''],['Dos','2 adults','',''],['Khloe','2 adults','',''],['Gianna','2 adults','',''],['Alithia','2 adults','',''],['Chelseah','2 adults','',''],['Cedric','1 adult','',''],['Kirstine Maryel','1 adult','',''],['Keira Haruhi','1 adult','',''],['Steven Grant','1 adult','',''],['Kyrie','2 adults','',''],['Yohan Zild','1 adult','',''],['Sofia','2 adults','',''],['Warren Stefano','1 adult','',''],['Aliyah','1 adult','',''],['Kira Selene','1 adult','',''],['Leloush','1 adult','Meal B & C','DINOSAUR'],['Ellis','1 adult','',''],['Xavier','1 kid + 1 adult','',''],['Kianna','2 adults','',''],['Megan Jamie Ababan','2 adults','',''],['Giannis Brent','1 adult','Food Bundle 1 - Php 167',''],['Radley Timothy Dayrit','1 adult','','']].map((x,i)=>({id:i+1,child:x[0],companions:x[1],food:x[2],wishlist:x[3]}));
let guests;try{guests=JSON.parse(localStorage.getItem('prekinder2Party'))||base}catch(e){guests=base}let current=null;const list=document.getElementById('list'), search=document.getElementById('search');function render(){let q=search.value.toLowerCase();list.innerHTML=guests.filter(g=>g.child.toLowerCase().includes(q)).map(g=>`<div class="card" onclick="edit(${g.id})"><div class="name">${g.id}. ${g.child}</div><div class="tag">👥 ${g.companions}</div><div><b>🍗 Food:</b> ${esc(g.food)||'<span class="muted">Tap to add</span>'}</div><div style="margin-top:8px"><b>🎁 Wishlist:</b> ${esc(g.wishlist)||'<span class="muted">Tap to add</span>'}</div></div>`).join('')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function edit(id){current=guests.find(g=>g.id===id);title.textContent=current.child;comp.textContent='👥 '+current.companions;food.value=current.food;wish.value=current.wishlist;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function save(){current.food=food.value.trim();current.wishlist=wish.value.trim();localStorage.setItem('prekinder2Party',JSON.stringify(guests));closeModal();render();alert('Details saved successfully!')}food.addEventListener('input',autosave);wish.addEventListener('input',autosave);function autosave(){if(!current)return;current.food=food.value.trim();current.wishlist=wish.value.trim();localStorage.setItem('prekinder2Party',JSON.stringify(guests));render()}search.addEventListener('input',render);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});render();
</script></body></html>
